server {
    # GKE/Cloud Run convention -- same port our backend container exposes.
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Try the exact file, then a directory, then fall back to
        # index.html. Required for client-side routing (react-router-dom):
        # a hard refresh on e.g. /projects has no matching file on disk,
        # so without this fallback nginx would 404 instead of letting
        # React Router take over and render the /projects view.
        try_files $uri $uri/ /index.html;
    }
}
